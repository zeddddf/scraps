name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: Build & Test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error

  release:
    name: Package & Upload Release
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure & Build
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe"
          & $iscc scripts/installer.iss

      - name: Build portable zip
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/Release/Scraps.exe, build/Release/scraps-cli.exe, build/Release/scraps_screenshot.exe, build/Release/assets, LICENSE, README.md -DestinationPath "dist/Scraps-$ver-portable.zip" -Force

      - name: Upload to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = "${{ github.ref_name }}"
          gh release upload "$ver" dist/* --repo "$env:GITHUB_REPOSITORY" --clobber
